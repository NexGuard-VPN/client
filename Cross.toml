[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main"
pre-build = [
    "apt-get update",
    "apt-get install -y libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev pkg-config"
]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install -y libglib2.0-dev:arm64 libgtk-3-dev:arm64 libayatana-appindicator3-dev:arm64 libxdo-dev:arm64 pkg-config"
]
