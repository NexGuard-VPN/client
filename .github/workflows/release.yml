name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BASE_URL: https://nexguard.sh/download

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nexguard-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: nexguard-linux-arm64
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: nexguard-macos-arm64
            dmg: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: nexguard-macos-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nexguard-windows-amd64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev pkg-config

      - name: Update Cargo.toml version
        shell: bash
        run: sed -i.bak "s/^version = .*/version = \"${{ needs.prepare.outputs.version }}\"/" Cargo.toml && rm -f Cargo.toml.bak

      - name: Install cross (Linux ARM64)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Download wintun.dll (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun/wintun/bin/amd64/wintun.dll target/${{ matrix.target }}/release/

      - name: Rename binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/nexguard.exe ${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/nexguard ${{ matrix.artifact }}
            chmod +x ${{ matrix.artifact }}
          fi

      - name: Build DMG (macOS ARM64)
        if: matrix.dmg
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cp target/${{ matrix.target }}/release/nexguard target/release/nexguard
          bash scripts/build-dmg.sh "$VERSION"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload DMG
        if: matrix.dmg
        uses: actions/upload-artifact@v4
        with:
          name: NexGuard-macOS.dmg
          path: NexGuard-*.dmg

      - name: Upload wintun.dll
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wintun.dll
          path: target/${{ matrix.target }}/release/wintun.dll

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate version.json
        run: |
          cat > artifacts/version.json << EOF
          {
            "client": {
              "version": "${VERSION}",
              "platforms": {
                "macos-arm64": { "url": "${BASE_URL}/nexguard-macos-${VERSION}", "dmg": "${BASE_URL}/NexGuard-${VERSION}.dmg" },
                "macos-amd64": { "url": "${BASE_URL}/nexguard-macos-${VERSION}" },
                "linux-amd64": { "url": "${BASE_URL}/nexguard-linux-${VERSION}" },
                "linux-arm64": { "url": "${BASE_URL}/nexguard-linux-arm64-${VERSION}" },
                "windows-amd64": { "url": "${BASE_URL}/nexguard-windows-${VERSION}.exe" }
              }
            },
            "server": {
              "version": "1.4.0",
              "platforms": {
                "linux-amd64": { "url": "${BASE_URL}/nexguard-server-linux-1.4.0" },
                "linux-arm64": { "url": "${BASE_URL}/nexguard-server-linux-arm64-1.4.0" }
              }
            }
          }
          EOF

      - name: Rename artifacts with version
        run: |
          cd artifacts
          [ -f nexguard-macos-arm64 ] && cp nexguard-macos-arm64 nexguard-macos-${VERSION}
          [ -f nexguard-macos-amd64 ] && cp nexguard-macos-amd64 nexguard-macos-intel-${VERSION}
          [ -f nexguard-linux-amd64 ] && cp nexguard-linux-amd64 nexguard-linux-${VERSION}
          [ -f nexguard-linux-arm64 ] && cp nexguard-linux-arm64 nexguard-linux-arm64-${VERSION}
          [ -f nexguard-windows-amd64.exe ] && cp nexguard-windows-amd64.exe nexguard-windows-${VERSION}.exe
          for dmg in NexGuard-*-macOS.dmg; do
            [ -f "$dmg" ] && mv "$dmg" "NexGuard-${VERSION}.dmg"
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/nexguard-macos-${{ env.VERSION }}
            artifacts/nexguard-linux-${{ env.VERSION }}
            artifacts/nexguard-linux-arm64-${{ env.VERSION }}
            artifacts/nexguard-windows-${{ env.VERSION }}.exe
            artifacts/NexGuard-${{ env.VERSION }}.dmg
            artifacts/version.json
          generate_release_notes: true

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "artifacts/nexguard-macos-${{ env.VERSION }},artifacts/nexguard-macos-intel-${{ env.VERSION }},artifacts/nexguard-linux-${{ env.VERSION }},artifacts/nexguard-linux-arm64-${{ env.VERSION }},artifacts/nexguard-windows-${{ env.VERSION }}.exe,artifacts/NexGuard-${{ env.VERSION }}.dmg,artifacts/version.json"
          target: /var/www/nexguard/download/
          strip_components: 1
          overwrite: true

      - name: Update symlinks
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/nexguard/download
            chmod +x nexguard-macos-${{ env.VERSION }} nexguard-linux-${{ env.VERSION }} nexguard-linux-arm64-${{ env.VERSION }} 2>/dev/null
            ln -sf nexguard-macos-${{ env.VERSION }} macos
            ln -sf nexguard-macos-intel-${{ env.VERSION }} macos-intel
            ln -sf nexguard-linux-${{ env.VERSION }} linux
            ln -sf nexguard-linux-arm64-${{ env.VERSION }} linux-arm64
            ln -sf nexguard-windows-${{ env.VERSION }}.exe windows.exe
            ls -la macos linux linux-arm64 windows.exe version.json
