[package]
name = "nexguard"
version = "1.9.32"
edition = "2021"

[[bin]]
name = "nexguard"
path = "src/main.rs"

[dependencies]
boringtun = "0.7"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.31"
egui = "0.31"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
open = "5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }
ed25519-dalek = "2.2.0"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
